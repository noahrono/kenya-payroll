name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  # The tests run TypeScript directly, which needs a recent Node. The published
  # package is plain JavaScript, so check the built output on every supported version.
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use the built package
        run: |
          node --input-type=module -e "
            import { calculatePayroll } from './dist/index.js';
            const slip = calculatePayroll({ grossPay: 100000, period: '2026-02' });
            if (slip.netPay !== 70441.65) throw new Error('unexpected net pay: ' + slip.netPay);
            console.log('net pay', slip.netPay);
          "
